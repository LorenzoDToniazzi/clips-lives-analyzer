[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clips-lives-analyzer"
version = "0.1.0"
description = "Analisador local de VODs com alta cobertura editorial"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "faster-whisper>=1.1,<2",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
clips-lives = "clips_lives_analyzer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clips_lives_analyzer = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "F401"]

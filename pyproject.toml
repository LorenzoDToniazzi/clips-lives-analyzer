[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picotador-lives"
version = "1.1.0"
description = "Divide VODs grandes sem recodificar e preserva a minutagem global"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.scripts]
picotador-lives = "live_splitter.app:main"

[tool.setuptools.packages.find]
where = ["src"]
